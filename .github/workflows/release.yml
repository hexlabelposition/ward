name: Release

on:
  push:
    tags: ["v*"]

# Each job asks for the permissions it needs.
permissions: {}

jobs:
  version:
    name: Check the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the tag matches the package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

  # The same checks as for pushes to main, on the tagged commit.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # The package is built without publishing permissions, so dependencies and
  # third-party actions never run in the job that can publish.
  build:
    name: Build the package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: "*.tgz"
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Stage on npm
    needs: [version, ci, build]
    # The environment only allows v* tags, and npm only accepts trusted
    # publishing from this environment.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@hexlabelposition/ward
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Required to create the GitHub release.
      contents: write
      # Required for npm trusted publishing and provenance.
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      # Pre-releases (X.Y.Z-beta.N) go to the next dist-tag, others to latest.
      - id: tag
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) echo "dist-tag=next" >> "$GITHUB_OUTPUT" ;;
            *) echo "dist-tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac
      # The tarball from the build job is staged as is; no package scripts run
      # in the job that can publish. A staged version becomes installable only
      # after a maintainer approves it with 2FA on npmjs.com or with
      # `npm stage approve`. The trusted publisher cannot publish directly.
      - run: npm stage publish ./*.tgz --ignore-scripts --access public --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ steps.tag.outputs.dist-tag }}
      - name: Create GitHub release
        run: |
          flags=()
          if [ "$DIST_TAG" = next ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --repo "$GITHUB_REPOSITORY" "${flags[@]}"
        env:
          DIST_TAG: ${{ steps.tag.outputs.dist-tag }}
          GH_TOKEN: ${{ github.token }}
