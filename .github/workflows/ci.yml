name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these checks on the tagged commit.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # The release workflow runs the same jobs on this commit, from its tag.
    if: "!(github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore: release v'))"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: npm pack --dry-run

  # Bun is only the package manager here: tsdown, tsc and vitest run on the matrix Node.
  test-node:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    # The release workflow runs the same jobs on this commit, from its tag.
    if: "!(github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore: release v'))"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24, current]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test

  # Smoke test: the built package starts under Bun and Deno.
  # Running the full test suite on these runtimes is W23 / W81.
  test-runtime:
    name: smoke (${{ matrix.os }}, ${{ matrix.runtime }})
    # The release workflow runs the same jobs on this commit, from its tag.
    if: "!(github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore: release v'))"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        runtime: [bun, deno]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build
      - if: matrix.runtime == 'bun'
        run: bun dist/cli.mjs
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - if: matrix.runtime == 'deno'
        run: deno run -A dist/cli.mjs
